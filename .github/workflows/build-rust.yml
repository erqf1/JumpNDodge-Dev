name: Rust Build & Release

# Baut den Rust-Port (rust/) für Windows, Linux und macOS.
# Release nur bei Tags "rust-v*" - der Updater (updater.py/parse_version) ignoriert
# solche Tags, die Python-Releases (v*) bleiben also unberührt. Der Release wird als
# Vorabversion veröffentlicht und nie als "Latest" markiert.

on:
  push:
    branches: [ main ]
    paths: [ 'rust/**', '.github/workflows/build-rust.yml' ]
    tags: [ 'rust-v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            exe: JumpNDodge.exe
          - os: ubuntu-latest
            name: linux
            exe: JumpNDodge
          - os: macos-latest
            name: macos
            exe: JumpNDodge
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Linux-Abhängigkeiten (ALSA für den Sound)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Tests (Spiellogik, Netzwerk, Server)
        working-directory: rust
        run: cargo test -p jnd_core -p jnd_server --locked

      - name: Bauen
        working-directory: rust
        run: cargo build --release --locked --workspace

      - name: Paket zusammenstellen
        run: |
          mkdir -p "release/JumpNDodge-rust-${{ matrix.name }}"
          cp "rust/target/release/${{ matrix.exe }}" "release/JumpNDodge-rust-${{ matrix.name }}/"
          cp icon.ico LICENSE* "release/JumpNDodge-rust-${{ matrix.name }}/" 2>/dev/null || true
          SRV="JumpNDodge-Server-${{ matrix.name }}"
          mkdir -p "release/$SRV"
          if [ "${{ matrix.name }}" = "windows" ]; then SEXE=JumpNDodge-Server.exe; else SEXE=JumpNDodge-Server; fi
          cp "rust/target/release/$SEXE" "release/$SRV/"
          cp rust/server/LIESMICH.txt "release/$SRV/"
          cd release
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a "JumpNDodge-rust-${{ matrix.name }}.zip" "JumpNDodge-rust-${{ matrix.name }}"
            7z a "$SRV.zip" "$SRV"
          else
            chmod +x "JumpNDodge-rust-${{ matrix.name }}/${{ matrix.exe }}" "$SRV/$SEXE"
            zip -r "JumpNDodge-rust-${{ matrix.name }}.zip" "JumpNDodge-rust-${{ matrix.name }}"
            zip -r "$SRV.zip" "$SRV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: JumpNDodge-rust-${{ matrix.name }}
          path: |
            release/JumpNDodge-rust-${{ matrix.name }}.zip
            release/JumpNDodge-Server-${{ matrix.name }}.zip
          retention-days: 3

  # Phase 5: echter Server + zwei unsichtbare Spiele spielen zwei Runden gegeneinander
  multiplayer-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: e2e
      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config xvfb libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2
      - name: Debug-Build (der unsichtbare Testmodus gibt es nur im Debug-Build)
        working-directory: rust
        run: cargo build --workspace --locked
      - name: Ende-zu-Ende-Test
        working-directory: rust
        run: xvfb-run -a -s "-screen 0 1280x800x24" tests/mp_e2e.sh "$RUNNER_TEMP/e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplayer-e2e
          path: ${{ runner.temp }}/e2e
          retention-days: 5

  # Docker-Image des Servers (für CasaOS) - bei Releases nach ghcr.io
  server-docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/rust-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#rust-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: rust
          file: rust/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jumpndodge-server:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/jumpndodge-server:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/rust-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release im öffentlichen Archive-Repo (Vorabversion)
        uses: softprops/action-gh-release@v2
        with:
          repository: erqf1/JumpNDodge-Archive
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "JumpNDodge (Rust) ${{ github.ref_name }}"
          prerelease: true
          make_latest: false
          body: |
            Rust-Version von JumpNDodge (1:1-Port des Python-Spiels).
            - Eine einzelne Datei, kein Python nötig, startet sofort.
            - Spielstände sind kompatibel: `data/gameplay.json` funktioniert in beiden Versionen.
            - Mods sind in dieser Vorabversion noch nicht enthalten.
            - Sounds: wie bei der Python-Version den Ordner `data/sound` neben die exe legen.
          files: dist/*.zip
