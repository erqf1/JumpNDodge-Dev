name: Build & Publish Leaderboard Server

# Baut das server/-Image und published es nach ghcr.io, damit es ohne Terminal
# auf dem Heimserver installiert werden kann (CasaOS "App Store -> Custom
# Install -> Import" erwartet ein fertiges Registry-Image, keinen lokalen
# Build-Context - siehe server/README.md).

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/build-leaderboard-server.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jumpndodge-leaderboard:latest
