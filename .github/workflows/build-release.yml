name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (SDL2 runtime für pygame)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev libfreetype6-dev libportmidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build game with PyInstaller
        run: pyinstaller --onefile --name JumpNDodge JumpNDodge.py

      - name: Build updater with PyInstaller
        run: pyinstaller --onefile --name updater updater.py

      - name: Assemble release folder (nur Icon + Updater + Hauptspiel, sonst nichts)
        run: |
          mkdir -p release/JumpNDodge-linux
          cp dist/JumpNDodge release/JumpNDodge-linux/
          cp dist/updater release/JumpNDodge-linux/
          cp icon.ico release/JumpNDodge-linux/
          echo "${GITHUB_REF_NAME#v}" > release/JumpNDodge-linux/version.txt
          chmod +x release/JumpNDodge-linux/JumpNDodge release/JumpNDodge-linux/updater
          cd release && zip -r JumpNDodge-linux.zip JumpNDodge-linux

      - uses: actions/upload-artifact@v4
        with:
          name: JumpNDodge-linux
          path: release/JumpNDodge-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build game with PyInstaller
        run: pyinstaller --onefile --name JumpNDodge --icon=icon.ico JumpNDodge.py

      - name: Build updater with PyInstaller
        run: pyinstaller --onefile --name updater --icon=icon.ico updater.py

      - name: Assemble release folder (nur Icon + Updater + Hauptspiel, sonst nichts)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release/JumpNDodge-windows | Out-Null
          Copy-Item dist/JumpNDodge.exe release/JumpNDodge-windows/
          Copy-Item dist/updater.exe release/JumpNDodge-windows/
          Copy-Item icon.ico release/JumpNDodge-windows/
          ($env:GITHUB_REF_NAME -replace '^v', '') | Set-Content -Path release/JumpNDodge-windows/version.txt -NoNewline
          Compress-Archive -Path release/JumpNDodge-windows/* -DestinationPath release/JumpNDodge-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: JumpNDodge-windows
          path: release/JumpNDodge-windows.zip

  # Läuft nur bei einem Versions-Tag (z.B. "v1.0.0") und veröffentlicht beide
  # Builds automatisch als GitHub Release im ÖFFENTLICHEN Releases-Repo -
  # das ist das "Archiv" für Spieler. Der Quellcode bleibt im privaten Repo hier.
  release:
    needs: [ build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zips mit Versionsnummer aus dem Tag benennen
        run: |
          VERSION="${{ github.ref_name }}"
          mv artifacts/JumpNDodge-linux/JumpNDodge-linux.zip "artifacts/JumpNDodge-${VERSION}-linux.zip"
          mv artifacts/JumpNDodge-windows/JumpNDodge-windows.zip "artifacts/JumpNDodge-${VERSION}-windows.zip"

      - name: Create GitHub Release (im öffentlichen Releases-Repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: erqf1/JumpNDodge-Releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/JumpNDodge-${{ github.ref_name }}-linux.zip
            artifacts/JumpNDodge-${{ github.ref_name }}-windows.zip
