name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (SDL2 runtime für pygame + patchelf für Nuitka)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev libfreetype6-dev libportmidi-dev patchelf ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame nuitka

      # --- Nuitka: Source direkt zu echtem Maschinencode kompilieren ---
      # (statt PyInstaller, das nur .pyc-Bytecode in die exe packt und sich in Minuten
      # zurück-decompilen lässt). PyArmor kommt hier (noch) nicht zum Einsatz - die
      # Trial-Version hat ein zu kleines Größenlimit für JumpNDodge.py, dafür wäre eine
      # bezahlte Lizenz nötig.
      #
      # --standalone statt --onefile: --onefile entpackt sich beim Start selbst in einen
      # Temp-Ordner, was von vielen Antivirus-Heuristiken als Dropper-Verhalten gewertet
      # wird und zu Fehlalarmen führt (siehe VirusTotal-Scans). --standalone erzeugt
      # stattdessen einen fertigen Ordner mit exe + Support-Dateien, ohne Selbstentpacken.
      - name: Build game with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads \
            --output-dir=build_out --output-filename=JumpNDodge \
            JumpNDodge.py

      - name: Build updater with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads \
            --output-dir=build_out --output-filename=updater \
            updater.py

      - name: Assemble release folder (Standalone-Ordner + Icon, sonst nichts)
        run: |
          mkdir -p release/JumpNDodge-linux
          cp -r build_out/JumpNDodge.dist/. release/JumpNDodge-linux/
          cp -r build_out/updater.dist/. release/JumpNDodge-linux/
          cp icon.ico release/JumpNDodge-linux/
          echo "${GITHUB_REF_NAME#v}" > release/JumpNDodge-linux/version.txt
          chmod +x release/JumpNDodge-linux/JumpNDodge release/JumpNDodge-linux/updater
          cd release && zip -r JumpNDodge-linux.zip JumpNDodge-linux

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        with:
          name: JumpNDodge-linux
          path: release/JumpNDodge-linux.zip
          retention-days: 1

      - name: Zip mit Versionsnummer benennen (nur bei Tag-Push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv release/JumpNDodge-linux.zip "release/JumpNDodge-${GITHUB_REF_NAME}-linux.zip"

      - name: Create GitHub Release (im öffentlichen Archive-Repo)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: erqf1/JumpNDodge-Archive
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: release/JumpNDodge-${{ github.ref_name }}-linux.zip

  build-windows:
    needs: build-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame nuitka

      # --- Nuitka: Source direkt zu echtem Maschinencode kompilieren ---
      # --standalone statt --onefile, siehe Kommentar im build-linux Job weiter oben:
      # vermeidet das Selbstentpack-Verhalten, das AV-Fehlalarme auslöst.
      - name: Build game with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --windows-console-mode=disable --windows-icon-from-ico=icon.ico `
            --output-dir=build_out --output-filename=JumpNDodge `
            JumpNDodge.py

      - name: Build updater with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --windows-icon-from-ico=icon.ico `
            --output-dir=build_out --output-filename=updater `
            updater.py

      - name: Assemble release folder (Standalone-Ordner + Icon, sonst nichts)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release/JumpNDodge-windows | Out-Null
          Copy-Item build_out/JumpNDodge.dist/* release/JumpNDodge-windows/ -Recurse -Force
          Copy-Item build_out/updater.dist/* release/JumpNDodge-windows/ -Recurse -Force
          Copy-Item icon.ico release/JumpNDodge-windows/
          ($env:GITHUB_REF_NAME -replace '^v', '') | Set-Content -Path release/JumpNDodge-windows/version.txt -NoNewline
          Compress-Archive -Path release/JumpNDodge-windows/* -DestinationPath release/JumpNDodge-windows.zip

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        with:
          name: JumpNDodge-windows
          path: release/JumpNDodge-windows.zip
          retention-days: 1

      - name: Zip mit Versionsnummer benennen (nur bei Tag-Push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: Move-Item "release/JumpNDodge-windows.zip" "release/JumpNDodge-$env:GITHUB_REF_NAME-windows.zip"

      - name: Create GitHub Release (im öffentlichen Archive-Repo)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: erqf1/JumpNDodge-Archive
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: release/JumpNDodge-${{ github.ref_name }}-windows.zip

  # Beide Build-Jobs veroeffentlichen ihr Zip jetzt direkt selbst (siehe Steps oben),
  # damit gar keine Actions-Artifacts mehr fuer den Transport zwischen Jobs noetig sind -
  # GitHub-Release-Assets zaehlen (anders als Actions-Artifacts) nicht gegen das
  # Storage-Kontingent und laufen nie ab. Der Installer lebt separat im JumpNDodge-Repo
  # und wird nicht von dieser Pipeline gebaut. Der Quellcode bleibt hier, privat.
  #
  # Build-Kette jetzt: Source -> Nuitka (Kompilierung zu echtem Maschinencode statt
  # .pyc-Bytecode). PyArmor koennte spaeter als zusaetzliche Schicht ergaenzt werden,
  # falls eine bezahlte Lizenz angeschafft wird (die Trial-Version reicht fuer die
  # Groesse von JumpNDodge.py nicht aus).
