[package]
name = "jumpndodge"
version.workspace = true
edition = "2021"
description = "JumpNDodge Rust Edition"
license = "Apache-2.0"

build = "build.rs"

[[bin]]
name = "JumpNDodge"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[workspace]
members = ["core", "server"]

[workspace.package]
# Eine Version für Spiel, Bibliothek und Server (Online: Client und Server müssen gleich sein)
version = "5.0.1"

[dependencies]
jnd_core = { path = "core" }
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
fontdue = "0.9"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "symphonia-vorbis"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json", "native-certs"] }
arboard = { version = "3", default-features = false }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
rand = "0.8"
chrono = "0.4"
unicode-normalization = "0.1"
serde = "1"
gilrs = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
