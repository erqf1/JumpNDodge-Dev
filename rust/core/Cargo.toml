[package]
name = "jnd_core"
version.workspace = true
edition = "2021"
description = "JumpNDodge Spiellogik ohne Grafik (geteilt von Spiel und Multiplayer-Server)"
license = "Apache-2.0"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
# WebSocket-Weg (Cloudflare Tunnel); TLS nur fürs Spiel (Feature "tls"), der Server spricht ws:// hinter dem Tunnel
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[features]
default = []
tls = ["tungstenite/rustls-tls-native-roots"]
