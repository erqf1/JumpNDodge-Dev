[package]
name = "jnd_server"
version = "4.9.1"
edition = "2021"
description = "JumpNDodge Multiplayer-Server (Online-VS und Online-Koop, Direktverbindung per IP)"
license = "Apache-2.0"

[[bin]]
name = "JumpNDodge-Server"
path = "src/main.rs"

[dependencies]
jnd_core = { path = "../core" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
