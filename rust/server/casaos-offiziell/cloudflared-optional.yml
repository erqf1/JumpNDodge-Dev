# OPTIONAL: eigener Cloudflare-Tunnel nur für den JumpNDodge-Server.
# Nur nötig, wenn du NICHT den Tunnel nimmst, der schon mert.win bedient (empfohlen: den vorhandenen nehmen).
# CasaOS: App-Store -> "+" -> Importieren. Vorher bei TUNNEL_TOKEN den Token eintragen (nie ins Repo!).
# Läuft im Host-Netz, deshalb erreicht er den Server unter localhost:47801.
name: jumpndodge-tunnel
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: jumpndodge-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      # Token aus Cloudflare Zero Trust -> Networks -> Tunnels -> (dein Tunnel) -> Docker
      TUNNEL_TOKEN: ""

x-casaos:
  architectures: [amd64, arm64]
  main: cloudflared
  author: W-Software
  category: Network
  description:
    de_DE: Cloudflare Tunnel für den JumpNDodge-Server (play.mert.win -> localhost:47801).
    en_US: Cloudflare Tunnel for the JumpNDodge server (play.mert.win -> localhost:47801).
  tagline:
    de_DE: Tunnel für JumpNDodge
    en_US: Tunnel for JumpNDodge
  title:
    custom: JumpNDodge Tunnel
  icon: https://raw.githubusercontent.com/erqf1/JumpNDodge/main/icon.png
  port_map: ""
