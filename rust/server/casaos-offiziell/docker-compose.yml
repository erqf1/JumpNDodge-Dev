# Offizieller JumpNDodge-Server (play.mert.win) für CasaOS
# CasaOS: App-Store -> "+" (Benutzerdefinierte App) -> "Importieren" -> diese Datei einfügen -> Installieren.
# Danach im vorhandenen Cloudflare Tunnel den Namen play.mert.win auf Port 47801 zeigen lassen (siehe ANLEITUNG.md).
# Absichtlich OHNE eigenen cloudflared-Container: ohne Token startet der endlos neu und CasaOS zeigt die
# ganze App als kaputt. Wer einen eigenen Tunnel nur für den Server will: cloudflared-optional.yml.
name: jumpndodge-offiziell
services:
  jumpndodge-server:
    image: ghcr.io/erqf1/jumpndodge-server:latest
    container_name: jumpndodge-server
    restart: unless-stopped
    ports:
      # WebSocket - hierhin zeigt der Cloudflare Tunnel (play.mert.win)
      - target: 47801
        published: "47801"
        protocol: tcp
      # direkt per UDP (optional, braucht Portweiterleitung im Router)
      - target: 47800
        published: "47800"
        protocol: udp
    environment:
      JND_SERVER_NAME: "JumpNDodge Offiziell"
      JND_SERVER_MOTD: "Viel Spaß!"
      JND_SERVER_PASSWORD: ""
      JND_SERVER_MAX_ROOMS: "32"
      JND_SERVER_AUTO_UPDATE: "1"
    volumes:
      - type: bind
        source: /DATA/AppData/jumpndodge-server
        target: /data

x-casaos:
  architectures: [amd64, arm64]
  main: jumpndodge-server
  author: W-Software
  category: Games
  description:
    de_DE: Offizieller JumpNDodge-Server (play.mert.win) – bis zu 8 Spieler pro Raum, Chat, aktualisiert sich selbst. Erreichbar über den Cloudflare Tunnel (Port 47801).
    en_US: Official JumpNDodge server (play.mert.win) – up to 8 players per room, chat, updates itself. Reached through the Cloudflare Tunnel (port 47801).
  tagline:
    de_DE: JumpNDodge – offizieller Server
    en_US: JumpNDodge official server
  title:
    custom: JumpNDodge Offiziell
  icon: https://raw.githubusercontent.com/erqf1/JumpNDodge/main/icon.png
  port_map: ""
