# Offizieller JumpNDodge-Server (play.mert.win) für CasaOS
# CasaOS: App-Store -> "+" (Benutzerdefinierte App) -> "Importieren" -> diese Datei einfügen -> Installieren.
# Cloudflare Tunnel ist EINGEBAUT: bei TUNNEL_TOKEN den Token eines Tunnels eintragen (nur in CasaOS, nie ins Repo!)
# und im Cloudflare-Dashboard play.mert.win -> HTTP -> localhost:47801 setzen (siehe ANLEITUNG.md).
# Leer lassen = kein Tunnel (z.B. wenn ein vorhandener Tunnel auf <CasaOS-Adresse>:47801 zeigt).
name: jumpndodge-offiziell
services:
  jumpndodge-server:
    image: ghcr.io/erqf1/jumpndodge-server:latest
    container_name: jumpndodge-server
    restart: unless-stopped
    ports:
      # WebSocket + Replays - hierhin zeigt der Cloudflare Tunnel (play.mert.win)
      - target: 47801
        published: "47801"
        protocol: tcp
      # direkt per UDP (optional, braucht Portweiterleitung im Router)
      - target: 47800
        published: "47800"
        protocol: udp
    environment:
      JND_SERVER_NAME: "JumpNDodge Offiziell"
      JND_SERVER_MOTD: "Viel Spaß!"
      JND_SERVER_PASSWORD: ""
      JND_SERVER_MAX_ROOMS: "32"
      JND_SERVER_AUTO_UPDATE: "1"
      # Token aus Cloudflare Zero Trust -> Networks -> Tunnels -> (Tunnel) -> Docker-Befehl (der lange Teil nach --token)
      TUNNEL_TOKEN: ""
    volumes:
      - type: bind
        source: /DATA/AppData/jumpndodge-server
        target: /data

x-casaos:
  architectures: [amd64, arm64]
  main: jumpndodge-server
  author: W-Software
  category: Games
  description:
    de_DE: Offizieller JumpNDodge-Server (play.mert.win) – bis zu 8 Spieler pro Raum, Chat, Replays, aktualisiert sich selbst. Cloudflare Tunnel eingebaut (TUNNEL_TOKEN eintragen).
    en_US: Official JumpNDodge server (play.mert.win) – up to 8 players per room, chat, replays, updates itself. Cloudflare Tunnel built in (set TUNNEL_TOKEN).
  tagline:
    de_DE: JumpNDodge – offizieller Server
    en_US: JumpNDodge official server
  title:
    custom: JumpNDodge Offiziell
  icon: https://raw.githubusercontent.com/erqf1/JumpNDodge/main/icon.png
  port_map: ""
